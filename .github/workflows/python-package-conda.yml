name: Addon checker and unit testing in python

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4

    - name: setup-micromamba
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-file: tests/envs/test.yml
        environment-name: python-test-env
        cache-environment: true
        post-cleanup: 'all'

    - name: Lint with ruff
      shell: bash -l {0}
      run: |
        ruff check .

    - name: Test with kodi-addon-checker
      shell: bash -l {0}
      run: |
        kodi-addon-checker --branch=omega --allow-folder-id-mismatch

    - name: Unit tests with coverage
      shell: bash -l {0}
      run: |
        pytest tests --disable-warnings --cov --cov-report=term --cov-report=json:coverage.json

    - name: Read coverage percentage
      id: coverage
      shell: bash -l {0}
      run: |
        echo "pct=$(python -c 'import json; print(int(float(json.load(open("coverage.json"))["totals"]["percent_covered_display"])))')" >> "$GITHUB_OUTPUT"

    - name: Update coverage badge (master only)
      if: github.ref == 'refs/heads/master'
      continue-on-error: true
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_TOKEN }}
        gistID: 0456bf4f97b2e2facbf4c3183b97e4d1
        filename: coverage.json
        label: coverage
        message: ${{ steps.coverage.outputs.pct }}%
        valColorRange: ${{ steps.coverage.outputs.pct }}
        maxColorRange: 90
        minColorRange: 50
