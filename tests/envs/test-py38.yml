name: kodi-py38
# The Windows and Xbox builds of Kodi 20 and 21 bundle Python 3.8, so the
# addon has to import and run on it. This environment exists to prove that
# (see the py38-compat CI job and the Python note in AGENTS.md).
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - requests-cache=0.5.2
  - dateutils
  - pip
  - pytest
  - pip:
    - pytest-cov
